name: argos

include:
  - path: ./backend/docker-compose.yml
    project_directory: ./backend
    env_file: ./backend/.env.docker

services:
  frontend:
    image: argos/frontend:0.1.0
    build:
      context: ./frontend-argos
      args:
        VITE_API_URL: /api
        VITE_API_KEY: ${VITE_API_KEY:-}
    ports:
      - "127.0.0.1:${ARGOS_FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
