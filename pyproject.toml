[project]
name = "argos"
version = "0.1.0"
description = "Laboratorio de análisis de malware documental con agentes y DeepSeek"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
llm = ["openai>=1.40"]
crew = ["crewai>=1.15"]
yara = ["yara-python>=4.5"]
pdf = ["pypdf>=5"]
office = ["olefile>=0.47"]
binary = ["capstone>=5"]
postgres = ["psycopg[binary]>=3.2"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() en defaults es el patrón esperado

[tool.coverage.run]
source = ["api", "core", "tools", "graphs"]
omit = ["tests/*"]
